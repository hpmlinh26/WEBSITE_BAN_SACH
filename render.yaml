# Render Blueprint - deploy ca khoi MOT Store trong 1 web service Node.
# Frontend (Vite) build ra dist/, backend Express phuc vu dist/ + /api tren cung 1 cong.
#
# Cach deploy:
#   1. Push repo len GitHub.
#   2. Render Dashboard -> New + -> Blueprint -> chon repo nay -> Apply.
#   3. Mo URL Render cap (vd https://mot-store.onrender.com).
#
# LUU Y veo du lieu:
#   - Plan "free" KHONG co o dia ben (persistent disk). SQLite nam o storage tam:
#     danh muc/san pham van co (tu seed lai), nhung don hang/tai khoan moi se
#     reset khi service ngu day hoac redeploy. Tot cho demo.
#   - Muon giu du lieu vinh vien: doi `plan` thanh `starter` (tra phi) va bo comment
#     khoi `disk:` + envVar DATA_DIR ben duoi.

services:
  - type: web
    name: mot-store
    runtime: node
    rootDir: BTL
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm install --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # APP_BASE_URL khong can dat: config tu dong dung RENDER_EXTERNAL_URL
      # (Render bom san) nen redirect/IPN cua MoMo tro dung domain that.
      # ===== Thanh toan MoMo =====
      # sync: false => KHONG luu gia tri trong git. Khi Apply Blueprint, Render
      # se hoi va luu cac bien nay trong Dashboard (Environment).
      # Nhap bo credential TEST cong khai cua MoMo (xem backend/.env.example) hoac
      # credential merchant that:
      #   MOMO_PARTNER_CODE   = MOMOBKUN20180529
      #   MOMO_ACCESS_KEY     = klm05TvNBzhg7h7j
      #   MOMO_SECRET_KEY     = at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa
      #   MOMO_ENDPOINT       = https://test-payment.momo.vn/v2/gateway/api/create
      - key: MOMO_PARTNER_CODE
        sync: false
      - key: MOMO_ACCESS_KEY
        sync: false
      - key: MOMO_SECRET_KEY
        sync: false
      - key: MOMO_ENDPOINT
        sync: false
      - key: MOMO_REQUEST_TYPE
        value: payWithMethod
      - key: MOMO_LANG
        value: vi
      # - key: DATA_DIR
      #   value: /var/data
